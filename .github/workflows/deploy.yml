name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Prepare GitHub Pages artifacts
        run: |
          mkdir -p .output/public
          cd .output/public

          # .nojekyll を配置（_build や assets が Jekyll によって除外されるのを防止）
          touch .nojekyll

          # index.html が存在しない場合は assets から自動生成
          if [ ! -f "index.html" ]; then
            JS_FILE=$(find assets -name "index-*.js" 2>/dev/null | head -n 1)
            CSS_FILE=$(find assets -name "styles-*.css" 2>/dev/null | head -n 1)
            cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>まなびポケット</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" />
EOF
            if [ -n "$CSS_FILE" ]; then
              echo "  <link rel="stylesheet" href=\"./$CSS_FILE\" />" >> index.html
            fi
            cat << 'EOF' >> index.html
</head>
<body>
  <div id="root"></div>
EOF
            if [ -n "$JS_FILE" ]; then
              echo "  <script type=\"module\" src=\"./$JS_FILE\"></script>" >> index.html
            fi
            echo "</body></html>" >> index.html
          fi

          # 404.html を index.html からコピー（SPA ルーティング対応）
          if [ -f "index.html" ]; then
            cp index.html 404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ".output/public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
